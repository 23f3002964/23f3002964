<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#131926"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#3fb950;#58a6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#3fb950;#58a6ff;#bc8cff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3fb950">
        <animate attributeName="stop-color" values="#3fb950;#58a6ff;#bc8cff;#3fb950" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="897" height="217" rx="15" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Subtle animated background wave -->
  <path fill="url(#waveGrad)">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="
        M0,165 C220,130 420,200 660,155 C780,132 850,155 900,145 L900,220 L0,220 Z;
        M0,150 C240,195 450,125 680,170 C790,190 860,140 900,160 L900,220 L0,220 Z;
        M0,165 C220,130 420,200 660,155 C780,132 850,155 900,145 L900,220 L0,220 Z
      "/>
  </path>

  <!-- Floating particles -->
  <circle cx="760" cy="48" r="3" fill="#58a6ff" opacity="0.7">
    <animate attributeName="cy" values="48;36;48" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="76" r="2.5" fill="#bc8cff" opacity="0.7">
    <animate attributeName="cy" values="76;90;76" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="790" cy="110" r="2" fill="#3fb950" opacity="0.8">
    <animate attributeName="cy" values="110;96;110" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Live status badge -->
  <rect x="44" y="34" width="235" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="62" cy="47" r="4.5" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="75" y="51" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.6">BUILDING ML, AI &amp; SYSTEMS</text>

  <!-- Main Title -->
  <text x="44" y="108" fill="#f0f6fc" font-family="Segoe UI, Ubuntu, sans-serif" font-size="40" font-weight="800" letter-spacing="1.2">Aditya Raj</text>
  <text x="44" y="140" fill="#58a6ff" font-family="Segoe UI, Ubuntu, sans-serif" font-size="16" font-weight="600">ML Engineer  ·  Competitive Data Scientist  ·  IIT Madras BS</text>
  <text x="44" y="172" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13">Kaggle Rank 474/3532 (S6E8)  •  Medical Imaging &amp; Segmentation  •  Time-Series  •  Linux Automation</text>
</svg>
